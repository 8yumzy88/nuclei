[project]
name = "vtt"
version = "1.0.0"
description = "Vulnerability Triage Tool (VTT) - A Python wrapper for Nuclei scanner"
readme = "README_VTT.md"
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
full = [
    "python-dotenv",
    "openai",
    "google-generativeai>=0.3.0; python_version >= '3.9'",
]

[project.scripts]
vtt = "vtt.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
